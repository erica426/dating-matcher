<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱匹配助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFD6E8 0%, #D6E8FF 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 214, 232, 0.3);
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #FFD6E8;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF9ECE;
        }

        textarea.form-input {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 158, 206, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 2px solid #ddd;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #FF9ECE;
            display: block;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
        }

        .date-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .date-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .match-score {
            font-size: 32px;
            font-weight: bold;
            color: #FF9ECE;
        }

        .date-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 12px;
            background: #FFD6E8;
            color: #FF9ECE;
            border-radius: 8px;
            font-size: 12px;
        }

        .date-notes {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-text {
            color: #999;
            font-size: 16px;
        }

        .nav-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .nav-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 20px;
            font-weight: bold;
            color: #FF9ECE;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #FFD6E8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #FF9ECE;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #FFD6E8;
        }

        .onboarding-progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E5E7EB;
            transition: all 0.3s;
        }

        .progress-dot.active {
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            width: 32px;
            border-radius: 6px;
        }

        .step-indicator {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #FFD6E8;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 158, 206, 0.5);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            cursor: pointer;
            border: none;
        }

        .slider-value {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #FF9ECE;
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }
            .card {
                padding: 24px;
            }
            .title {
                font-size: 28px;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // 使用纯JavaScript，不用React - 这样可以避免React的重渲染问题
        
        class DatingApp {
            constructor() {
                this.currentScreen = 'login';
                this.onboardingStep = 0;
                this.userData = {
                    username: '',
                    values: '',
                    lifeStage: '',
                    idealLifestyle: '',
                    personality: '',
                    mbti: '',
                    lifestyle: '',
                    interests: '',
                    sexualCompatibility: '',
                    hasCompletedOnboarding: false
                };
                this.dates = [];
                this.currentDate = this.getEmptyDate();
                this.loginForm = { username: '', password: '' };
                
                this.onboardingSteps = [
                    {
                        title: "价值观",
                        field: "values",
                        placeholder: "你最看重什么？例如：诚实、家庭、个人成长、自由...",
                        description: "权重：20% - 核心价值观决定了你们能否长期相处",
                    },
                    {
                        title: "人生阶段",
                        field: "lifeStage",
                        placeholder: "你现在处于什么阶段？例如：创业中、稳定工作、准备结婚、追求梦想...",
                        description: "权重：30% - 人生阶段的匹配度最为关键",
                    },
                    {
                        title: "理想生活方式",
                        field: "idealLifestyle",
                        placeholder: "你希望过怎样的生活？例如：稳定安逸、充满冒险、平衡工作生活...",
                        description: "权重：20% - 生活方式的契合影响日常相处",
                    },
                    {
                        title: "亲密关系观念",
                        field: "sexualCompatibility",
                        placeholder: "性在关系中的重要程度？例如：非常重要、比较重要、一般、不太重要...",
                        description: "权重：10% - 新增维度，影响关系的深度和满意度",
                    },
                    {
                        title: "性格特点",
                        field: "personality",
                        placeholder: "你的性格是？例如：外向、内向、善解人意、理性...",
                        description: "权重：5% - 性格互补或相似都可能有好的化学反应",
                    }
                ];
                
                this.loadData();
                this.init();
            }
            
            getEmptyDate() {
                return {
                    name: '',
                    values: '',
                    lifeStage: '',
                    idealLifestyle: '',
                    personality: '',
                    mbti: '',
                    lifestyle: '',
                    interests: '',
                    sexualCompatibility: '',
                    subjectiveRating: 5,
                    notes: ''
                };
            }
            
            loadData() {
                const savedUserData = localStorage.getItem('userData');
                const savedDates = localStorage.getItem('dates');
                if (savedUserData) {
                    this.userData = JSON.parse(savedUserData);
                }
                if (savedDates) {
                    this.dates = JSON.parse(savedDates);
                }
            }
            
            saveUserData() {
                localStorage.setItem('userData', JSON.stringify(this.userData));
            }
            
            saveDates() {
                localStorage.setItem('dates', JSON.stringify(this.dates));
            }
            
            calculateSimilarity(str1, str2) {
                if (!str1 || !str2) return 0;
                const s1 = str1.toLowerCase();
                const s2 = str2.toLowerCase();
                if (s1 === s2) return 1;
                if (s1.includes(s2) || s2.includes(s1)) return 0.8;
                return 0.5;
            }
            
            calculateMatch(date) {
                let totalScore = 0;
                const weights = {
                    lifeStage: 0.30,
                    idealLifestyle: 0.20,
                    values: 0.20,
                    sexualCompatibility: 0.10,
                    personality: 0.05,
                    mbti: 0.05,
                    lifestyle: 0.05,
                    interests: 0.05
                };

                Object.keys(weights).forEach(key => {
                    if (this.userData[key] && date[key]) {
                        const similarity = this.calculateSimilarity(this.userData[key], date[key]);
                        totalScore += similarity * weights[key];
                    }
                });

                return Math.round(totalScore * 100);
            }
            
            init() {
                this.render();
            }
            
            render() {
                const root = document.getElementById('root');
                
                switch(this.currentScreen) {
                    case 'login':
                        root.innerHTML = this.renderLogin();
                        this.bindLoginEvents();
                        break;
                    case 'onboarding':
                        root.innerHTML = this.renderOnboarding();
                        this.bindOnboardingEvents();
                        break;
                    case 'main':
                        root.innerHTML = this.renderMain();
                        this.bindMainEvents();
                        break;
                    case 'addDate':
                        root.innerHTML = this.renderAddDate();
                        this.bindAddDateEvents();
                        break;
                }
            }
            
            renderLogin() {
                return `
                    <div class="container">
                        <div class="card">
                            <h1 class="title">恋爱匹配助手</h1>
                            <p class="subtitle">用理性找到心动的答案</p>

                            <div class="form-group">
                                <label class="form-label">用户名</label>
                                <input
                                    type="text"
                                    class="form-input"
                                    id="login-username"
                                    placeholder="请输入用户名"
                                    value="${this.loginForm.username}"
                                    maxlength="50"
                                />
                            </div>

                            <div class="form-group">
                                <label class="form-label">密码</label>
                                <input
                                    type="password"
                                    class="form-input"
                                    id="login-password"
                                    placeholder="请输入密码"
                                    value="${this.loginForm.password}"
                                    maxlength="50"
                                />
                            </div>

                            <button class="btn btn-primary" id="login-btn">
                                登录
                            </button>

                            <p style="text-align: center; margin-top: 30px; color: #999; font-size: 14px;">
                                您的隐私受到保护 · 数据加密存储
                            </p>
                        </div>
                    </div>
                `;
            }
            
            bindLoginEvents() {
                const usernameInput = document.getElementById('login-username');
                const passwordInput = document.getElementById('login-password');
                const loginBtn = document.getElementById('login-btn');
                
                usernameInput.addEventListener('input', (e) => {
                    this.loginForm.username = e.target.value;
                });
                
                passwordInput.addEventListener('input', (e) => {
                    this.loginForm.password = e.target.value;
                });
                
                loginBtn.addEventListener('click', () => {
                    if (this.loginForm.username && this.loginForm.password) {
                        this.userData.username = this.loginForm.username;
                        this.saveUserData();
                        this.currentScreen = this.userData.hasCompletedOnboarding ? 'main' : 'onboarding';
                        this.render();
                    } else {
                        alert('请输入用户名和密码');
                    }
                });
            }
            
            renderOnboarding() {
                const step = this.onboardingSteps[this.onboardingStep];
                const totalSteps = this.onboardingSteps.length;
                
                let progressDots = '';
                for (let i = 0; i < totalSteps; i++) {
                    const isActive = i === this.onboardingStep || i < this.onboardingStep;
                    progressDots += `<div class="progress-dot ${isActive ? 'active' : ''}"></div>`;
                }
                
                return `
                    <div class="container">
                        <div class="card">
                            <div class="step-indicator">
                                步骤 ${this.onboardingStep + 1} / ${totalSteps}
                            </div>

                            <div class="onboarding-progress">
                                ${progressDots}
                            </div>

                            <h2 class="title">${step.title}</h2>
                            <p class="subtitle">${step.description}</p>

                            <div class="form-group">
                                <textarea
                                    class="form-input"
                                    id="onboarding-input"
                                    placeholder="${step.placeholder}"
                                    rows="4"
                                    maxlength="1000"
                                >${this.userData[step.field] || ''}</textarea>
                                <div class="char-counter">
                                    <span id="char-count">${(this.userData[step.field] || '').length}</span> / 1000
                                </div>
                            </div>

                            <div style="display: flex; gap: 12px; margin-top: 30px;">
                                ${this.onboardingStep > 0 ? '<button class="btn btn-secondary" id="prev-btn">上一步</button>' : ''}
                                <button class="btn btn-primary" id="next-btn">
                                    ${this.onboardingStep < totalSteps - 1 ? '下一步' : '完成'}
                                </button>
                            </div>

                            ${this.onboardingStep === 0 ? '<p style="text-align: center; margin-top: 20px; color: #999; font-size: 14px;">💡 填写越详细，匹配度计算越准确</p>' : ''}
                        </div>
                    </div>
                `;
            }
            
            bindOnboardingEvents() {
                const input = document.getElementById('onboarding-input');
                const charCount = document.getElementById('char-count');
                const nextBtn = document.getElementById('next-btn');
                const prevBtn = document.getElementById('prev-btn');
                const step = this.onboardingSteps[this.onboardingStep];
                
                input.addEventListener('input', (e) => {
                    this.userData[step.field] = e.target.value;
                    charCount.textContent = e.target.value.length;
                    this.saveUserData();
                });
                
                nextBtn.addEventListener('click', () => {
                    if (!this.userData[step.field]) {
                        alert('请填写此项再继续');
                        return;
                    }
                    
                    if (this.onboardingStep < this.onboardingSteps.length - 1) {
                        this.onboardingStep++;
                        this.render();
                    } else {
                        this.userData.hasCompletedOnboarding = true;
                        this.saveUserData();
                        this.currentScreen = 'main';
                        this.render();
                    }
                });
                
                if (prevBtn) {
                    prevBtn.addEventListener('click', () => {
                        this.onboardingStep--;
                        this.render();
                    });
                }
            }
            
            renderMain() {
                const datesWithMatch = this.dates.map(date => ({
                    ...date,
                    matchScore: this.calculateMatch(date)
                })).sort((a, b) => b.matchScore - a.matchScore);

                const avgMatch = this.dates.length > 0
                    ? Math.round(datesWithMatch.reduce((sum, d) => sum + d.matchScore, 0) / this.dates.length)
                    : 0;
                
                let dateCards = '';
                if (datesWithMatch.length === 0) {
                    dateCards = `
                        <div class="empty-state">
                            <div class="empty-icon">💕</div>
                            <div class="empty-text">还没有约会记录，开始添加吧！</div>
                        </div>
                    `;
                } else {
                    datesWithMatch.forEach((date, idx) => {
                        dateCards += `
                            <div class="date-card">
                                <div class="date-header">
                                    <div class="date-name">${date.name || '未命名'}</div>
                                    <div class="match-score">${date.matchScore}%</div>
                                </div>
                                <div class="date-tags">
                                    ${date.lifeStage ? `<span class="tag">${date.lifeStage.substring(0, 20)}</span>` : ''}
                                    ${date.mbti ? `<span class="tag">${date.mbti}</span>` : ''}
                                </div>
                                ${date.notes ? `<div class="date-notes">${date.notes}</div>` : ''}
                            </div>
                        `;
                    });
                }
                
                return `
                    <div class="nav-header">
                        <div class="nav-content">
                            <div class="nav-title">💕 恋爱匹配助手</div>
                            <div class="nav-buttons">
                                <button class="nav-btn" id="edit-profile-btn">个人信息</button>
                                <button class="nav-btn" id="logout-btn">退出</button>
                            </div>
                        </div>
                    </div>

                    <div class="container">
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-number">${this.dates.length}</span>
                                <span class="stat-label">约会对象</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-number">${avgMatch}%</span>
                                <span class="stat-label">平均匹配度</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-number">${datesWithMatch.length > 0 ? datesWithMatch[0].matchScore : 0}%</span>
                                <span class="stat-label">最高匹配</span>
                            </div>
                        </div>

                        <button class="btn btn-primary" id="add-date-btn">
                            ➕ 添加约会对象
                        </button>

                        <h2 style="font-size: 24px; font-weight: bold; margin: 40px 0 20px 0;">约会记录</h2>

                        ${dateCards}
                    </div>
                `;
            }
            
            bindMainEvents() {
                document.getElementById('add-date-btn').addEventListener('click', () => {
                    this.currentDate = this.getEmptyDate();
                    this.currentScreen = 'addDate';
                    this.render();
                });
                
                document.getElementById('edit-profile-btn').addEventListener('click', () => {
                    this.onboardingStep = 0;
                    this.currentScreen = 'onboarding';
                    this.render();
                });
                
                document.getElementById('logout-btn').addEventListener('click', () => {
                    if (confirm('确定要退出吗？')) {
                        localStorage.clear();
                        window.location.reload();
                    }
                });
            }
            
            renderAddDate() {
                return `
                    <div class="container">
                        <div class="card">
                            <h1 class="title">记录约会对象</h1>

                            <div class="form-group">
                                <label class="form-label">姓名/代号 *</label>
                                <input class="form-input" id="date-name" placeholder="例如：小王、Alex" value="${this.currentDate.name}" maxlength="50" />
                            </div>

                            <div class="form-group">
                                <label class="form-label">人生阶段 * (权重30%)</label>
                                <textarea class="form-input" id="date-lifeStage" placeholder="例如：创业中、稳定工作、准备结婚..." maxlength="500">${this.currentDate.lifeStage}</textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">理想生活方式 * (权重20%)</label>
                                <textarea class="form-input" id="date-idealLifestyle" placeholder="例如：稳定安逸、充满冒险..." maxlength="500">${this.currentDate.idealLifestyle}</textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">价值观 * (权重20%)</label>
                                <textarea class="form-input" id="date-values" placeholder="例如：诚实、家庭、个人成长..." maxlength="500">${this.currentDate.values}</textarea>
                            </div>

                            <div class="form-group">
                                <label class="form-label">亲密关系观念 * (权重10%)</label>
                                <input class="form-input" id="date-sexualCompatibility" placeholder="例如：非常重要、比较重要、一般..." value="${this.currentDate.sexualCompatibility}" maxlength="100" />
                            </div>

                            <div class="form-group">
                                <label class="form-label">性格特点</label>
                                <input class="form-input" id="date-personality" placeholder="例如：外向、善解人意..." value="${this.currentDate.personality}" maxlength="200" />
                            </div>

                            <div class="form-group">
                                <label class="form-label">MBTI</label>
                                <input class="form-input" id="date-mbti" placeholder="例如：INFP、ENTJ..." value="${this.currentDate.mbti}" maxlength="10" />
                            </div>

                            <div class="form-group">
                                <label class="form-label">主观印象评分 (<span id="rating-display">${this.currentDate.subjectiveRating}</span>/10)</label>
                                <input type="range" min="1" max="10" class="slider" id="date-rating" value="${this.currentDate.subjectiveRating}" />
                                <div class="slider-value"><span id="rating-value">${this.currentDate.subjectiveRating}</span> 分</div>
                            </div>

                            <div class="form-group">
                                <label class="form-label">备注</label>
                                <textarea class="form-input" id="date-notes" placeholder="记录约会的关键时刻和感受..." maxlength="1000">${this.currentDate.notes}</textarea>
                            </div>

                            <button class="btn btn-primary" id="save-date-btn">保存</button>
                            <button class="btn btn-secondary" id="cancel-date-btn">取消</button>
                        </div>
                    </div>
                `;
            }
            
            bindAddDateEvents() {
                const fields = ['name', 'lifeStage', 'idealLifestyle', 'values', 'sexualCompatibility', 'personality', 'mbti', 'notes'];
                
                fields.forEach(field => {
                    const el = document.getElementById(`date-${field}`);
                    el.addEventListener('input', (e) => {
                        this.currentDate[field] = e.target.value;
                    });
                });
                
                const ratingSlider = document.getElementById('date-rating');
                const ratingDisplay = document.getElementById('rating-display');
                const ratingValue = document.getElementById('rating-value');
                
                ratingSlider.addEventListener('input', (e) => {
                    this.currentDate.subjectiveRating = parseInt(e.target.value);
                    ratingDisplay.textContent = e.target.value;
                    ratingValue.textContent = e.target.value;
                });
                
                document.getElementById('save-date-btn').addEventListener('click', () => {
                    if (!this.currentDate.name || !this.currentDate.lifeStage || !this.currentDate.idealLifestyle || !this.currentDate.values) {
                        alert('请填写所有必填项（带*号的）');
                        return;
                    }
                    
                    this.currentDate.dateTime = new Date().toISOString();
                    this.dates.push({...this.currentDate});
                    this.saveDates();
                    this.currentScreen = 'main';
                    this.render();
                });
                
                document.getElementById('cancel-date-btn').addEventListener('click', () => {
                    this.currentScreen = 'main';
                    this.render();
                });
            }
        }
        
        // 初始化应用
        new DatingApp();
    </script>
</body>
</html>
