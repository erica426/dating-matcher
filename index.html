        // Supabase 客户端
        class SimpleSupabase {
            constructor(url, key) {
                this.url = url;
                this.key = key;
                this.headers = {
                    'Content-Type': 'application/json',
                    'apikey': key,
                    'Authorization': `Bearer ${key}`
                };
            }
            
            async query(table, params = {}) {
                let url = `${this.url}/rest/v1/${table}`;
                const queryParams = [];
                
                if (params.select) queryParams.push(`select=${params.select}`);
                if (params.eq) {
                    Object.keys(params.eq).forEach(key => {
                        queryParams.push(`${key}=eq.${params.eq[key]}`);
                    });
                }
                if (params.limit) queryParams.push(`limit=${params.limit}`);
                
                if (queryParams.length > 0) {
                    url += '?' + queryParams.join('&');
                }
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: this.headers
                });
                
                return await response.json();
            }
            
            async insert(table, data) {
                const response = await fetch(`${this.url}/rest/v1/${table}`, {
                    method: 'POST',
                    headers: {
                        ...this.headers,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(data)
                });
                
                return await response.json();
            }
            
            async update(table, id, data) {
                const response = await fetch(`${this.url}/rest/v1/${table}?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        ...this.headers,
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(data)

                }
                if (savedDates) {
                    this.dates = JSON.parse(savedDates);

                // Load any external test results from localStorage
                this.loadExternalTestResults();
                
                // Load test results from database (if Supabase is configured)
                await this.loadTestResultsFromDatabase();

            loadExternalTestResults() {
                // Check for any test results saved by external users
                for (let i = 0; i < this.dates.length; i++) {
                    const testResultKey = `test_result_${i}`;
                    const savedResult = localStorage.getItem(testResultKey);
                    if (savedResult && !this.dates[i].loveLanguage) {
                        try {
                            this.dates[i].loveLanguage = JSON.parse(savedResult);
                            // Clean up the temporary storage
                            localStorage.removeItem(testResultKey);
                            this.saveDates();
                        } catch (e) {

                        }
                    }
                }

                localStorage.setItem('dates', JSON.stringify(this.dates));

            calculateSimilarity(str1, str2) {
                if (!str1 || !str2) return 0;
                const s1 = str1.toLowerCase();
                const s2 = str2.toLowerCase();
                if (s1 === s2) return 1;
                if (s1.includes(s2) || s2.includes(s1)) return 0.8;
                return 0.5;
            }
            
            calculateMatch(date) {
                let totalScore = 0;
                const weights = {
                    lifeStage: 0.30,
                    idealLifestyle: 0.20,
                    values: 0.20,
                    sexualCompatibility: 0.10,
                    personality: 0.05,
                    mbti: 0.05,
                };

                Object.keys(weights).forEach(key => {
                    if (this.userData[key] && date[key]) {
                        const similarity = this.calculateSimilarity(this.userData[key], date[key]);
                        totalScore += similarity * weights[key];
                    }
                });

                return Math.round(totalScore * 100);
            }
            
            needsOnboarding() {
                // 检查用户是否填写了基本信息
                return !this.userData.values || !this.userData.lifeStage || !this.userData.idealLifestyle;
            }
            
            formatLoveLanguage(loveLanguage) {
                if (!loveLanguage) return '';
                const parts = [];
                Object.entries(loveLanguage).forEach(([key, value]) => {
                    if (value > 0) {
                        const fullName = LOVE_LANGUAGE_NAMES[key];
                        parts.push(`${fullName}(${key}):${value}`);
                    }
                });
                return parts.join(' ');
            }

            bindOnboardingEvents() {

                    { field: 'values' },
                    { field: 'lifeStage' },
                    { field: 'idealLifestyle' },
                    { field: 'sexualCompatibility' },
                    { field: 'mbti' }
                ];
                
                const currentStep = steps[this.onboardingStep];
                const input = document.getElementById('onboarding-input');
                const nextBtn = document.getElementById('next-btn');
                const prevBtn = document.getElementById('prev-btn');
                const skipBtn = document.getElementById('skip-btn');
                
                // 实时保存输入
                input.addEventListener('input', (e) => {
                    this.userData[currentStep.field] = e.target.value;
                });
                
                // 下一步/完成
                nextBtn.addEventListener('click', () => {
                    this.userData[currentStep.field] = input.value;
                    this.saveUserData();
                    
                    if (this.onboardingStep < steps.length - 1) {
                        this.onboardingStep++;
                        this.render();
                    } else {
                        // 完成引导
                        this.currentScreen = 'main';
                        this.render();
                    }
                });
                
                // 上一步
                if (prevBtn) {
                    prevBtn.addEventListener('click', () => {
                        this.userData[currentStep.field] = input.value;
                        this.saveUserData();
                        this.onboardingStep--;
                        this.render();
                    });
                }
                
                // 跳过引导
                if (skipBtn) {
                    skipBtn.addEventListener('click', () => {

                    if (e.key === 'Enter' && !e.shiftKey) {

                        nextBtn.click();

            async loadTestResultsFromDatabase() {
                if (!supabase) {
                    console.warn('[Load Test Results] ⚠️ Supabase not configured');
                    return { success: false, reason: 'no_supabase' };
                }
                
                try {
                    const userId = this.userData.username;
                    if (!userId) {
                        console.warn('[Load Test Results] ⚠️ No username');
                        return { success: false, reason: 'no_username' };
                    }
                    
                    console.log('[Load Test Results] 🔄 Loading for user:', userId);
                    console.log('[Load Test Results] 📊 Current dates count:', this.dates.length);
                    
                    // 查询该用户的所有测试结果
                    const results = await supabase.query('love_test_results', {
                        eq: { user_id: userId }
                    });
                    
                    console.log('[Load Test Results] 📥 Database returned:', results);
                    
                    if (!results || !Array.isArray(results)) {
                        console.error('[Load Test Results] ❌ Invalid response format:', results);
                        return { success: false, reason: 'invalid_response' };
                    }
                    
                    if (results.length === 0) {
                        console.log('[Load Test Results] ℹ️ No results found in database');
                        return { success: true, updated: 0 };
                    }
                    
                    let updated = 0;
                    let notFound = [];
                    
                    results.forEach(result => {
                        const dateIndex = result.date_index;
                        console.log(`[Load Test Results] 🔍 Processing index ${dateIndex}:`, result.scores);
                        
                        if (this.dates[dateIndex]) {
                            this.dates[dateIndex].loveLanguage = result.scores;
                            updated++;
                            console.log(`[Load Test Results] ✅ Updated date ${dateIndex} (${this.dates[dateIndex].name})`);
                        } else {
                            notFound.push(dateIndex);
                            console.warn(`[Load Test Results] ⚠️ Date index ${dateIndex} not found (total dates: ${this.dates.length})`);
                        }
                    });
                    
                    if (notFound.length > 0) {
                        console.error('[Load Test Results] ❌ Missing date indexes:', notFound);
                    }
                    
                    if (updated > 0) {
                        this.saveDates();
                        console.log(`[Load Test Results] 💾 Saved ${updated} updates`);
                    }
                    
                    return { success: true, updated, notFound, total: results.length };
                } catch (error) {
                    console.error('[Load Test Results] ❌ Error:', error);
                    return { success: false, reason: 'exception', error };
                }
            }

                            <div class="nav-buttons">
                                <button class="nav-btn" onclick="app.backToMain()">返回主页</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="container">
                        <div class="chart-container">
                            <div class="chart-title">匹配度 Top 5</div>
                            <div class="bar-chart">
                                ${topListHTML}
                            </div>
                        </div>
                        
                        <div class="stats-grid">
                            <div class="stat-card">
                                <span class="stat-number">${avgScore}%</span>
                                <span class="stat-label">平均匹配度</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-number">${datesWithMatch[0].matchScore}%</span>
                                <span class="stat-label">最高匹配度</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-number">${datesWithMatch[datesWithMatch.length - 1].matchScore}%</span>
                                <span class="stat-label">最低匹配度</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            renderMonthlyReport() {
                if (this.dates.length === 0) {
                    return `
                        <div class="nav-header">
                            <div class="nav-content">
                                <div class="nav-title">📝 月度报告</div>
                                <div class="nav-buttons">
                                    <button class="nav-btn" onclick="app.backToMain()">返回主页</button>
                                </div>
                            </div>
                        </div>
                        <div class="container">
                            <div class="empty-state">
                                <div class="empty-icon">📝</div>
                                <div class="empty-text">暂无数据，请先添加约会对象</div>
                            </div>
                        </div>
                    `;
                }
                
                const currentMonth = new Date().toLocaleString('zh-CN', { year: 'numeric', month: 'long' });
                const datesWithMatch = this.dates.map(date => ({
                    ...date,
                    matchScore: this.calculateMatch(date)
                })).sort((a, b) => b.matchScore - a.matchScore);
                
                const highMatches = datesWithMatch.filter(d => d.matchScore >= 80);
                const mediumMatches = datesWithMatch.filter(d => d.matchScore >= 60 && d.matchScore < 80);
                const lowMatches = datesWithMatch.filter(d => d.matchScore < 60);
                
                const bestMatch = datesWithMatch[0];
                const avgScore = Math.round(datesWithMatch.reduce((sum, d) => sum + d.matchScore, 0) / datesWithMatch.length);
                
                // 生成洞察
                let insights = this.generateInsights(datesWithMatch);
                
                return `
                    <div class="nav-header">
                        <div class="nav-content">
                            <div class="nav-title">📝 月度报告</div>
                            <div class="nav-buttons">
                                <button class="nav-btn" onclick="app.backToMain()">返回主页</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="container">
                        <div class="card">
                            <h1 class="title">${currentMonth}约会报告</h1>
                            <p class="subtitle">数据驱动的恋爱洞察</p>
                            
                            <div class="report-section">
                                <h3>📊 总体概况</h3>
                                <div class="stats-grid">
                                    <div class="stat-card">
                                        <span class="stat-number">${this.dates.length}</span>
                                        <span class="stat-label">总约会人数</span>
                                    </div>
                                    <div class="stat-card">
                                        <span class="stat-number">${avgScore}%</span>
                                        <span class="stat-label">平均匹配度</span>
                                    </div>
                                    <div class="stat-card">
                                        <span class="stat-number">${highMatches.length}</span>
                                        <span class="stat-label">高匹配(≥80%)</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="report-section">
                                <h3>⭐ 最佳匹配</h3>
                                <div class="insight-card">
                                    <div class="insight-title">${bestMatch.name} - ${bestMatch.matchScore}%</div>
                                    <div class="insight-text">
                                        ${bestMatch.name}是你目前匹配度最高的对象。${this.getMatchReasons(bestMatch)}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="report-section">
                                <h3>💡 关键洞察</h3>
                                ${insights}
                            </div>
                            
                            <div class="report-section">
                                <h3>📈 匹配度分布</h3>
                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                                    <div class="stat-card">
                                        <span class="stat-number" style="color: #9370DB;">${highMatches.length}</span>
                                        <span class="stat-label">高匹配 (≥80%)</span>
                                    </div>
                                    <div class="stat-card">
                                        <span class="stat-number" style="color: #FF9ECE;">${mediumMatches.length}</span>
                                        <span class="stat-label">中等匹配 (60-79%)</span>
                                    </div>
                                    <div class="stat-card">
                                        <span class="stat-number" style="color: #D4A5A5;">${lowMatches.length}</span>
                                        <span class="stat-label">低匹配 (<60%)</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="report-section">
                                <h3>🎯 建议</h3>
                                <div class="insight-card">
                                    <div class="insight-text">
                                        ${this.getRecommendations(datesWithMatch)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            getMatchReasons(date) {
                let reasons = [];
                const lifeStageMatch = this.calculateSimilarity(this.userData.lifeStage, date.lifeStage);
                const lifestyleMatch = this.calculateSimilarity(this.userData.idealLifestyle, date.idealLifestyle);
                const valuesMatch = this.calculateSimilarity(this.userData.values, date.values);
                
                if (lifeStageMatch >= 0.8) reasons.push('你们处于相似的人生阶段');
                if (lifestyleMatch >= 0.8) reasons.push('对生活方式有共同期待');
                if (valuesMatch >= 0.8) reasons.push('核心价值观高度契合');
                
                return reasons.length > 0 ? reasons.join('，') + '。' : '各方面都有不错的契合度。';
            }
            
            generateInsights(datesWithMatch) {
                let insights = '';
                
                // 洞察1：平均匹配度趋势
                const avgScore = Math.round(datesWithMatch.reduce((sum, d) => sum + d.matchScore, 0) / datesWithMatch.length);
                if (avgScore >= 70) {
                    insights += `
                        <div class="insight-card">
                            <div class="insight-title">✨ 优秀的筛选能力</div>
                            <div class="insight-text">
                                你的平均匹配度达到${avgScore}%，说明你在筛选约会对象时已经有了清晰的标准，这将帮助你更快找到合适的人。
                            </div>
                        </div>
                    `;
                } else if (avgScore >= 50) {
                    insights += `
                        <div class="insight-card">
                            <div class="insight-title">📊 正常的探索阶段</div>
                            <div class="insight-text">
                                你的平均匹配度为${avgScore}%，这表明你正在积极探索不同类型的对象。继续保持开放心态，同时也可以更明确自己的需求。
                            </div>
                        </div>
                    `;
                } else {
                    insights += `
                        <div class="insight-card">
                            <div class="insight-title">🔍 建议重新审视标准</div>
                            <div class="insight-text">
                                你的平均匹配度为${avgScore}%，建议重新审视一下自己的择偶标准，或者在约会前做更多了解，以提高匹配度。
                            </div>
                        </div>
                    `;
                }
                
                // 洞察2：高分对象的共同特征
                const highMatches = datesWithMatch.filter(d => d.matchScore >= 75);
                if (highMatches.length >= 2) {
                    insights += `
                        <div class="insight-card">
                            <div class="insight-title">🎯 理想型画像</div>
                            <div class="insight-text">
                                你有${highMatches.length}位高匹配度对象，他们的共同特点可能就是你的"理想型"。建议对比这些对象的特征，明确你最看重的品质。
                            </div>
                        </div>
                    `;
                }
                
                return insights;
            }
            
            getRecommendations(datesWithMatch) {
                const highMatches = datesWithMatch.filter(d => d.matchScore >= 80);
                
                if (highMatches.length === 0) {
                    return '建议：1. 重新审视个人信息，确保填写完整准确；2. 在约会前多了解对方，提高匹配成功率；3. 保持开放心态，给不同类型的人机会。';
                } else if (highMatches.length <= 2) {
                    return `建议：1. 重点关注${highMatches[0].name}等高匹配对象；2. 继续扩大约会范围，寻找更多潜在对象；3. 深入了解高匹配对象，进入下一阶段。`;
                } else {
                    return `建议：1. 你已有${highMatches.length}位高匹配对象，可以开始深入交往；2. 对比他们的优缺点，做出明智选择；3. 保持真诚，建立深层连接。`;
                }
            }
            
            bindReportEvents() {
                // 报告页面不需要特殊事件绑定
            }
        }
        
        // 初始化应用
        const app = new DatingApp();
    </script>
</body>
</html>
