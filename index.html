<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋爱匹配助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFD6E8 0%, #D6E8FF 100%);
            min-height: 100vh;
        }

        #root {
            min-height: 100vh;
        }

        /* 通用样式 */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 214, 232, 0.3);
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 30px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #FFD6E8;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF9ECE;
        }

        textarea.form-input {
            min-height: 80px;
            resize: vertical;
        }

        /* 按钮样式 */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(255, 158, 206, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #666;
            border: 2px solid #ddd;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #FF9ECE;
            display: block;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: #999;
        }

        /* 约会对象卡片 */
        .date-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .date-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .date-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        .match-score {
            font-size: 32px;
            font-weight: bold;
            color: #FF9ECE;
        }

        .date-tags {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 12px;
            background: #FFD6E8;
            color: #FF9ECE;
            border-radius: 8px;
            font-size: 12px;
        }

        .date-notes {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-text {
            color: #999;
            font-size: 16px;
        }

        /* 导航 */
        .nav-header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .nav-content {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 20px;
            font-weight: bold;
            color: #FF9ECE;
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            padding: 8px 16px;
            background: white;
            border: 2px solid #FFD6E8;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #FF9ECE;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #FFD6E8;
        }

        /* 引导流程样式 */
        .onboarding-progress {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #E5E7EB;
            transition: all 0.3s;
        }

        .progress-dot.active {
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            width: 32px;
            border-radius: 6px;
        }

        .step-indicator {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* 滑块样式 */
        .slider-container {
            margin: 20px 0;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #FFD6E8;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 158, 206, 0.5);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF9ECE 0%, #93C5FD 100%);
            cursor: pointer;
            border: none;
        }

        .slider-value {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #FF9ECE;
            margin-top: 8px;
        }

        /* 响应式 */
        @media (max-width: 640px) {
            .container {
                padding: 20px 16px;
            }

            .card {
                padding: 24px;
            }

            .title {
                font-size: 28px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [currentScreen, setCurrentScreen] = useState('login');
            const [onboardingStep, setOnboardingStep] = useState(0);
            const [userData, setUserData] = useState({
                username: '',
                values: '',
                lifeStage: '',
                idealLifestyle: '',
                personality: '',
                mbti: '',
                lifestyle: '',
                interests: '',
                sexualCompatibility: '',
                hasCompletedOnboarding: false
            });
            const [dates, setDates] = useState([]);
            const [currentDate, setCurrentDate] = useState({
                name: '',
                values: '',
                lifeStage: '',
                idealLifestyle: '',
                personality: '',
                mbti: '',
                lifestyle: '',
                interests: '',
                sexualCompatibility: '',
                subjectiveRating: 5,
                notes: ''
            });
            const [loginForm, setLoginForm] = useState({ username: '', password: '' });

            // 引导流程步骤定义
            const onboardingSteps = [
                {
                    title: "价值观",
                    field: "values",
                    placeholder: "你最看重什么？例如：诚实、家庭、个人成长、自由...",
                    description: "权重：20% - 核心价值观决定了你们能否长期相处",
                },
                {
                    title: "人生阶段",
                    field: "lifeStage",
                    placeholder: "你现在处于什么阶段？例如：创业中、稳定工作、准备结婚、追求梦想...",
                    description: "权重：30% - 人生阶段的匹配度最为关键",
                },
                {
                    title: "理想生活方式",
                    field: "idealLifestyle",
                    placeholder: "你希望过怎样的生活？例如：稳定安逸、充满冒险、平衡工作生活...",
                    description: "权重：20% - 生活方式的契合影响日常相处",
                },
                {
                    title: "亲密关系观念",
                    field: "sexualCompatibility",
                    placeholder: "性在关系中的重要程度？例如：非常重要、比较重要、一般、不太重要...",
                    description: "权重：10% - 新增维度，影响关系的深度和满意度",
                },
                {
                    title: "性格特点",
                    field: "personality",
                    placeholder: "你的性格是？例如：外向、内向、善解人意、理性...",
                    description: "权重：5% - 性格互补或相似都可能有好的化学反应",
                }
            ];

            // 从localStorage加载数据
            useEffect(() => {
                const savedUserData = localStorage.getItem('userData');
                const savedDates = localStorage.getItem('dates');
                if (savedUserData) {
                    const parsed = JSON.parse(savedUserData);
                    setUserData(parsed);
                    // 如果已完成引导，直接进入主页面
                    if (parsed.hasCompletedOnboarding && currentScreen === 'login') {
                        setCurrentScreen('main');
                    }
                }
                if (savedDates) setDates(JSON.parse(savedDates));
            }, []);

            // 保存数据到localStorage
            useEffect(() => {
                if (userData.username) {
                    localStorage.setItem('userData', JSON.stringify(userData));
                }
            }, [userData]);

            useEffect(() => {
                localStorage.setItem('dates', JSON.stringify(dates));
            }, [dates]);

            // 计算匹配度
            const calculateMatch = (date) => {
                let totalScore = 0;
                let weights = {
                    lifeStage: 0.30,
                    idealLifestyle: 0.20,
                    values: 0.20,
                    sexualCompatibility: 0.10,
                    personality: 0.05,
                    mbti: 0.05,
                    lifestyle: 0.05,
                    interests: 0.05
                };

                Object.keys(weights).forEach(key => {
                    if (userData[key] && date[key]) {
                        const similarity = calculateSimilarity(userData[key], date[key]);
                        totalScore += similarity * weights[key];
                    }
                });

                return Math.round(totalScore * 100);
            };

            const calculateSimilarity = (str1, str2) => {
                if (!str1 || !str2) return 0;
                const s1 = str1.toLowerCase();
                const s2 = str2.toLowerCase();
                if (s1 === s2) return 1;
                if (s1.includes(s2) || s2.includes(s1)) return 0.8;
                return 0.5;
            };

            // 登录界面
            const LoginScreen = () => (
                <div className="container">
                    <div className="card">
                        <h1 className="title">恋爱匹配助手</h1>
                        <p className="subtitle">用理性找到心动的答案</p>

                        <div className="form-group">
                            <label className="form-label">用户名</label>
                            <input
                                type="text"
                                className="form-input"
                                placeholder="请输入用户名"
                                value={loginForm.username}
                                onChange={(e) => setLoginForm({...loginForm, username: e.target.value})}
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">密码</label>
                            <input
                                type="password"
                                className="form-input"
                                placeholder="请输入密码"
                                value={loginForm.password}
                                onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                            />
                        </div>

                        <button
                            className="btn btn-primary"
                            onClick={() => {
                                if (loginForm.username && loginForm.password) {
                                    setUserData({...userData, username: loginForm.username});
                                    // 如果之前完成过引导，直接进入主页面
                                    if (userData.hasCompletedOnboarding) {
                                        setCurrentScreen('main');
                                    } else {
                                        setCurrentScreen('onboarding');
                                    }
                                } else {
                                    alert('请输入用户名和密码');
                                }
                            }}
                        >
                            登录
                        </button>

                        <p style={{textAlign: 'center', marginTop: '30px', color: '#999', fontSize: '14px'}}>
                            您的隐私受到保护 · 数据加密存储
                        </p>
                    </div>
                </div>
            );

            // 引导流程界面
            const OnboardingScreen = () => {
                const currentStepData = onboardingSteps[onboardingStep];
                const totalSteps = onboardingSteps.length;

                return (
                    <div className="container">
                        <div className="card">
                            <div className="step-indicator">
                                步骤 {onboardingStep + 1} / {totalSteps}
                            </div>

                            <div className="onboarding-progress">
                                {onboardingSteps.map((_, index) => (
                                    <div 
                                        key={index}
                                        className={`progress-dot ${index === onboardingStep ? 'active' : ''} ${index < onboardingStep ? 'active' : ''}`}
                                    />
                                ))}
                            </div>

                            <h2 className="title">{currentStepData.title}</h2>
                            <p className="subtitle">{currentStepData.description}</p>

                            <div className="form-group">
                                <textarea
                                    className="form-input"
                                    placeholder={currentStepData.placeholder}
                                    value={userData[currentStepData.field] || ''}
                                    onChange={(e) => setUserData({
                                        ...userData,
                                        [currentStepData.field]: e.target.value
                                    })}
                                    rows="4"
                                    maxLength="1000"
                                />
                                <div style={{textAlign: 'right', fontSize: '12px', color: '#999', marginTop: '4px'}}>
                                    {(userData[currentStepData.field] || '').length} / 1000
                                </div>
                            </div>

                            <div style={{display: 'flex', gap: '12px', marginTop: '30px'}}>
                                {onboardingStep > 0 && (
                                    <button
                                        className="btn btn-secondary"
                                        onClick={() => setOnboardingStep(onboardingStep - 1)}
                                    >
                                        上一步
                                    </button>
                                )}
                                <button
                                    className="btn btn-primary"
                                    onClick={() => {
                                        if (!userData[currentStepData.field]) {
                                            alert('请填写此项再继续');
                                            return;
                                        }
                                        if (onboardingStep < totalSteps - 1) {
                                            setOnboardingStep(onboardingStep + 1);
                                        } else {
                                            // 完成引导
                                            setUserData({...userData, hasCompletedOnboarding: true});
                                            setCurrentScreen('main');
                                        }
                                    }}
                                >
                                    {onboardingStep < totalSteps - 1 ? '下一步' : '完成'}
                                </button>
                            </div>

                            {onboardingStep === 0 && (
                                <p style={{textAlign: 'center', marginTop: '20px', color: '#999', fontSize: '14px'}}>
                                    💡 填写越详细，匹配度计算越准确
                                </p>
                            )}
                        </div>
                    </div>
                );
            };

            // 主界面
            const MainScreen = () => {
                const datesWithMatch = dates.map(date => ({
                    ...date,
                    matchScore: calculateMatch(date)
                })).sort((a, b) => b.matchScore - a.matchScore);

                const avgMatch = dates.length > 0
                    ? Math.round(datesWithMatch.reduce((sum, d) => sum + d.matchScore, 0) / dates.length)
                    : 0;

                return (
                    <>
                        <div className="nav-header">
                            <div className="nav-content">
                                <div className="nav-title">💕 恋爱匹配助手</div>
                                <div className="nav-buttons">
                                    <button className="nav-btn" onClick={() => {
                                        setOnboardingStep(0);
                                        setCurrentScreen('onboarding');
                                    }}>
                                        个人信息
                                    </button>
                                    <button className="nav-btn" onClick={() => {
                                        if (confirm('确定要退出吗？')) {
                                            localStorage.clear();
                                            setCurrentScreen('login');
                                        }
                                    }}>
                                        退出
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="container">
                            <div className="stats-grid">
                                <div className="stat-card">
                                    <span className="stat-number">{dates.length}</span>
                                    <span className="stat-label">约会对象</span>
                                </div>
                                <div className="stat-card">
                                    <span className="stat-number">{avgMatch}%</span>
                                    <span className="stat-label">平均匹配度</span>
                                </div>
                                <div className="stat-card">
                                    <span className="stat-number">{datesWithMatch.length > 0 ? datesWithMatch[0].matchScore : 0}%</span>
                                    <span className="stat-label">最高匹配</span>
                                </div>
                            </div>

                            <button
                                className="btn btn-primary"
                                onClick={() => {
                                    setCurrentDate({
                                        name: '',
                                        values: '',
                                        lifeStage: '',
                                        idealLifestyle: '',
                                        personality: '',
                                        mbti: '',
                                        lifestyle: '',
                                        interests: '',
                                        sexualCompatibility: '',
                                        subjectiveRating: 5,
                                        notes: ''
                                    });
                                    setCurrentScreen('addDate');
                                }}
                            >
                                ➕ 添加约会对象
                            </button>

                            <h2 style={{fontSize: '24px', fontWeight: 'bold', margin: '40px 0 20px 0'}}>约会记录</h2>

                            {datesWithMatch.length === 0 ? (
                                <div className="empty-state">
                                    <div className="empty-icon">💕</div>
                                    <div className="empty-text">还没有约会记录，开始添加吧！</div>
                                </div>
                            ) : (
                                datesWithMatch.map((date, idx) => (
                                    <div key={idx} className="date-card">
                                        <div className="date-header">
                                            <div className="date-name">{date.name || '未命名'}</div>
                                            <div className="match-score">{date.matchScore}%</div>
                                        </div>
                                        <div className="date-tags">
                                            {date.lifeStage && <span className="tag">{date.lifeStage.substring(0, 20)}</span>}
                                            {date.mbti && <span className="tag">{date.mbti}</span>}
                                        </div>
                                        {date.notes && <div className="date-notes">{date.notes}</div>}
                                    </div>
                                ))
                            )}
                        </div>
                    </>
                );
            };

            // 添加约会对象界面
            const AddDateScreen = () => (
                <div className="container">
                    <div className="card">
                        <h1 className="title">记录约会对象</h1>

                        <div className="form-group">
                            <label className="form-label">姓名/代号 *</label>
                            <input
                                className="form-input"
                                placeholder="例如：小王、Alex"
                                value={currentDate.name}
                                onChange={(e) => setCurrentDate({...currentDate, name: e.target.value})}
                                maxLength="50"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">人生阶段 * (权重30%)</label>
                            <textarea
                                className="form-input"
                                placeholder="例如：创业中、稳定工作、准备结婚..."
                                value={currentDate.lifeStage}
                                onChange={(e) => setCurrentDate({...currentDate, lifeStage: e.target.value})}
                                maxLength="500"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">理想生活方式 * (权重20%)</label>
                            <textarea
                                className="form-input"
                                placeholder="例如：稳定安逸、充满冒险..."
                                value={currentDate.idealLifestyle}
                                onChange={(e) => setCurrentDate({...currentDate, idealLifestyle: e.target.value})}
                                maxLength="500"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">价值观 * (权重20%)</label>
                            <textarea
                                className="form-input"
                                placeholder="例如：诚实、家庭、个人成长..."
                                value={currentDate.values}
                                onChange={(e) => setCurrentDate({...currentDate, values: e.target.value})}
                                maxLength="500"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">亲密关系观念 * (权重10%)</label>
                            <input
                                className="form-input"
                                placeholder="例如：非常重要、比较重要、一般..."
                                value={currentDate.sexualCompatibility}
                                onChange={(e) => setCurrentDate({...currentDate, sexualCompatibility: e.target.value})}
                                maxLength="100"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">性格特点</label>
                            <input
                                className="form-input"
                                placeholder="例如：外向、善解人意..."
                                value={currentDate.personality}
                                onChange={(e) => setCurrentDate({...currentDate, personality: e.target.value})}
                                maxLength="200"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">MBTI</label>
                            <input
                                className="form-input"
                                placeholder="例如：INFP、ENTJ..."
                                value={currentDate.mbti}
                                onChange={(e) => setCurrentDate({...currentDate, mbti: e.target.value})}
                                maxLength="10"
                            />
                        </div>

                        <div className="form-group">
                            <label className="form-label">主观印象评分 ({currentDate.subjectiveRating}/10)</label>
                            <input
                                type="range"
                                min="1"
                                max="10"
                                className="slider"
                                value={currentDate.subjectiveRating}
                                onChange={(e) => setCurrentDate({...currentDate, subjectiveRating: parseInt(e.target.value)})}
                            />
                            <div className="slider-value">{currentDate.subjectiveRating} 分</div>
                        </div>

                        <div className="form-group">
                            <label className="form-label">备注</label>
                            <textarea
                                className="form-input"
                                placeholder="记录约会的关键时刻和感受..."
                                value={currentDate.notes}
                                onChange={(e) => setCurrentDate({...currentDate, notes: e.target.value})}
                                maxLength="1000"
                            />
                        </div>

                        <button
                            className="btn btn-primary"
                            onClick={() => {
                                if (!currentDate.name || !currentDate.lifeStage || !currentDate.idealLifestyle || !currentDate.values) {
                                    alert('请填写所有必填项（带*号的）');
                                    return;
                                }
                                setDates([...dates, {...currentDate, dateTime: new Date().toISOString()}]);
                                setCurrentScreen('main');
                            }}
                        >
                            保存
                        </button>

                        <button className="btn btn-secondary" onClick={() => setCurrentScreen('main')}>
                            取消
                        </button>
                    </div>
                </div>
            );

            // 渲染当前界面
            const renderScreen = () => {
                switch (currentScreen) {
                    case 'login':
                        return <LoginScreen />;
                    case 'onboarding':
                        return <OnboardingScreen />;
                    case 'main':
                        return <MainScreen />;
                    case 'addDate':
                        return <AddDateScreen />;
                    default:
                        return <LoginScreen />;
                }
            };

            return renderScreen();
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
